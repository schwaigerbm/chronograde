<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chronograde Loading</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      -webkit-app-region: drag;
    }

    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px;
    }

    .logo-badge {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.5);
      margin-bottom: 16px;
    }

    .logo-badge svg {
      width: 32px;
      height: 32px;
      color: #ffffff;
    }

    .app-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .app-subtitle {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 24px;
      font-weight: 500;
    }

    .progress-bar-container {
      width: 220px;
      height: 4px;
      background: #1e293b;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-value {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #60a5fa, #3b82f6);
      background-size: 200% 100%;
      border-radius: 4px;
      animation: loading 1.5s infinite linear;
    }

    @keyframes loading {
      0% {
        transform: translateX(-100%);
      }
      100% {
        transform: translateX(100%);
      }
    }

    .status-text {
      margin-top: 12px;
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="logo-badge">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
        <polyline points="9 10 12 13 16 7"/>
      </svg>
    </div>
    <div class="app-title">Chronograde</div>
    <div class="app-subtitle">School Admin 2026</div>

    <div class="progress-bar-container">
      <div class="progress-bar-value"></div>
    </div>

    <div class="status-text">Wird gestartet...</div>
  </div>
</body>
</html>
